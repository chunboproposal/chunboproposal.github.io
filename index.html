<style>
/* Layout: 로고 머리줄 → 문의 종류 3가지(카드) → 공급 제안: 안내(절차 · 제출 자료) + 4단계 양식 → 제출 완료 */
:root{
  color-scheme:light;
  --bg:#f6f7fa; --surface:#ffffff; --surface2:#eef1f7; --line:#dde2ec; --line2:#c9d0dd;
  --ink:#0d1b3d; --ink2:#3a4762; --mute:#6d7891; --faint:#98a1b5;
  --navy:#14266e; --blue:#1b8fd6; --navy-soft:#e9ecf8;
  --ok:#1d8a5a; --ok-soft:#e5f5ed; --bad:#c2303b; --bad-soft:#fbeaec; --warn:#b26b00; --warn-soft:#fff3df;
  --grad:linear-gradient(135deg,#a3238e 0%,#6a2c91 45%,#13a3b5 100%);
  --f-disp:"IBM Plex Sans KR","Noto Sans KR","Noto Sans SC","Malgun Gothic","Microsoft YaHei",sans-serif;
  --f-body:"Noto Sans KR","Noto Sans SC","Malgun Gothic","Apple SD Gothic Neo","Microsoft YaHei",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6}
body{word-break:keep-all;overflow-wrap:anywhere;min-height:100vh;display:flex;flex-direction:column}#view{flex:1 0 auto}
#view:has(.home){background:var(--surface)}
img{max-width:100%}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:1040px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--f-disp);text-wrap:balance;color:var(--ink);margin:0}
.top{background:var(--surface);border-bottom:1px solid var(--line)}
.top .bar{display:flex;align-items:center;gap:28px;padding-block:0;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));min-height:68px;flex-wrap:nowrap}
.logo{display:inline-flex;align-items:center;border:0;background:none;padding:0;cursor:pointer}
.logo-svg{height:46px;width:auto;display:block}
@media (max-width:640px){.top .bar{flex-wrap:wrap;padding-block:8px}.top .bar .spacer{flex-basis:100%;order:1;height:0}.top .bar .stbtn,.top .bar .lang{order:2}}
@media (max-width:480px){.logo-svg{height:36px}.top .bar{gap:8px}.lang button{padding:5px 8px;font-size:12px}.stbtn span{padding:5px 9px;font-size:12px}}
.spacer{flex:1}
.lang{display:inline-flex;gap:2px;padding:3px;border:1px solid var(--line);border-radius:999px;background:var(--surface2)}
.lang button{border:0;background:transparent;padding:5px 12px;border-radius:999px;font-size:13px;font-weight:600;color:var(--ink2);cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--navy);color:#fff}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
/* 문의 종류 */
.home{padding-block:10px 70px;background:var(--surface)}
.sec-title{margin:40px 0 0;padding-bottom:18px;border-bottom:1px solid var(--ink);font-size:27px;font-weight:800}
.sec-desc{margin:22px 0 24px;color:var(--ink2);font-size:16px}
.sec-gap{height:28px}
.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:28px}
.card3{position:relative;min-height:250px;border:1px solid var(--line2);border-radius:22px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center;padding:26px;background:var(--surface);color:var(--ink)}
button.card3{cursor:pointer;font:inherit}
button.card3:hover{box-shadow:0 10px 30px rgba(13,27,61,.08);border-color:#b5bccb}
.card3 h3{margin:6px 0 0;font-size:22px;font-weight:800;letter-spacing:.04em}
.card3 p{margin:0;font-size:14px;color:var(--mute)}
.card3 .go{position:absolute;right:30px;bottom:24px;font-size:13px;color:var(--ink2);display:flex;align-items:center;gap:8px}
.card3 .go i{display:inline-block;width:22px;height:1px;background:#888;position:relative}
.card3 .go i::after{content:"";position:absolute;right:0;top:-3px;width:7px;height:1px;background:#888;transform:rotate(30deg);transform-origin:right}
.card3 .soon{position:absolute;top:18px;right:20px;padding:2px 10px;border-radius:999px;background:var(--surface2);color:var(--mute);font-size:12px;font-weight:700}
.card3.dim{opacity:.75}
.ico{width:64px;height:64px}
/* 공급 제안 */
.wrap.wide{max-width:1840px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px))}
.intro{padding-block:28px 4px}
.crumb{font-size:13px;color:var(--mute)}
.crumb button{border:0;background:none;padding:0;color:var(--blue);cursor:pointer;font-weight:600}
.intro h1{font-size:clamp(26px,4vw,34px);font-weight:700;margin:8px 0 10px}
.intro p{max-width:66ch;color:var(--ink2);margin:0}
.col-side .up{grid-template-columns:minmax(0,1fr) auto;row-gap:8px}.col-side .up > b{grid-column:1;grid-row:1}.col-side .up > .btn{grid-column:2;grid-row:1;justify-self:end}.col-side .up .files{grid-column:1/-1;grid-row:2}
.col-side .alert.miss{margin:0}.col-side .foot{margin-top:0}
.agree-row{display:flex;align-items:stretch;justify-content:space-between;gap:12px;flex-wrap:wrap}
.agree-row .ck{margin:0}.agree-row .sendbtn{min-width:160px;min-height:0;height:auto;margin-left:auto}
.sec-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.sec-head h3{display:flex;align-items:center;gap:8px;font-size:17px}
.ipills{display:inline-flex;flex-wrap:wrap;gap:2px;padding:3px;border:1px solid var(--line);border-radius:999px;background:var(--surface2)}
.ipills button{min-width:28px;height:26px;padding:0 9px;border:0;border-radius:999px;background:transparent;color:var(--ink2);font-family:var(--f-mono);font-size:12.5px;font-weight:600;cursor:pointer}
.ipills button:hover{background:#e2e7f0}.ipills button.bad{color:var(--bad);box-shadow:inset 0 0 0 1.5px var(--bad)}.ipills button.bad.on{background:var(--bad);color:#fff}.ipills button.on{background:#22a35a;color:#fff;box-shadow:0 2px 6px rgba(34,163,90,.28)}
.sec-head .cnt{display:inline-flex;align-items:center;justify-content:center;min-width:24px;height:24px;padding:0 7px;border-radius:999px;background:var(--navy);color:#fff;font-family:var(--f-mono);font-size:12.5px}
.intro-row{display:flex;align-items:flex-end;justify-content:space-between;gap:20px 32px;flex-wrap:wrap}
.intro-txt{min-width:0;flex:1 1 380px}
.flow{list-style:none;margin:0;padding:14px 18px;border:1px solid var(--line);border-radius:14px;background:var(--surface);display:grid;grid-template-columns:repeat(4,minmax(150px,1fr));gap:0 14px;flex:0 1 860px}
.flow li{position:relative;padding:0 0 0 38px;min-width:0}
.flow li .dot{position:absolute;left:0;top:0;width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--surface2);color:var(--mute);font-family:var(--f-mono);font-size:12px;font-weight:600}
.flow li.on .dot{background:var(--navy);color:#fff}
.flow li.past .dot{background:var(--ok);color:#fff}
.flow .n{display:block;font-family:var(--f-mono);font-size:11px;color:var(--blue);letter-spacing:.06em}
.flow b{display:block;font-family:var(--f-disp);font-size:14px;margin:1px 0 1px}
.flow small{display:block;color:var(--mute);font-size:12px;line-height:1.45}
.flow li.on b{color:var(--navy)}
.formgrid{display:grid;grid-template-columns:minmax(300px,0.85fr) minmax(0,1.3fr) minmax(320px,1fr);gap:20px;align-items:start}
.col-a,.col-b,.col-c{min-width:0;display:grid;gap:14px}
.formgrid > .done{grid-column:1/-1}
.col-a .grid{grid-template-columns:1fr}
.formgrid{align-items:stretch}.formgrid > .col-a,.formgrid > .col-c,.formgrid > .done{align-self:start}
.col-b{grid-template-rows:minmax(0,1fr)}
.col-b > #sec-items{display:flex;flex-direction:column}
#sec-items > .item:last-of-type{flex:1 1 auto;display:flex;flex-direction:column}
#sec-items > .item:last-of-type > .grid{flex:1 1 auto;grid-template-rows:repeat(5,auto) minmax(0,1fr)}
#sec-items > .item:last-of-type .f.full textarea{flex:1 1 auto;min-height:100px}
.stbtn{display:inline-flex;align-items:center;padding:3px;border:1px solid var(--line);border-radius:999px;background:var(--surface2);cursor:pointer;font:inherit}
.stbtn span{display:inline-flex;align-items:center;gap:6px;padding:5px 14px;border-radius:999px;font-size:13px;font-weight:700;color:var(--navy);line-height:1.6;background:var(--surface)}
.stbtn:hover span,.stbtn[aria-pressed="true"] span{background:var(--navy);color:#fff}
.stwrap{max-width:480px}
.wish-back{position:fixed;inset:0;z-index:50;background:rgba(13,27,61,.38);display:flex;align-items:flex-start;justify-content:center;padding:72px max(16px,env(safe-area-inset-right,0px)) 16px max(16px,env(safe-area-inset-left,0px));overflow:auto}
.wish{width:min(760px,100%);background:var(--surface);border-radius:16px;padding:20px 22px;box-shadow:0 24px 60px rgba(13,27,61,.25)}
.wish-h{display:flex;align-items:center}.wish-h h2{font-size:20px}.wish-x{margin-left:auto;border:0;background:none;font-size:26px;line-height:1;color:var(--mute);cursor:pointer}
.wish-d{margin:4px 0 14px;color:var(--mute);font-size:13.5px}
.wish-bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}.wish-bar input{flex:1 1 220px;height:40px;border:1px solid var(--line2);border-radius:10px;padding:0 12px;font-size:14px;background:var(--surface);color:var(--ink)}
.wish-bar .ipills button{height:30px;padding:0 14px;font-family:var(--f-body);font-size:13px}.wish-bar .ipills small{opacity:.75;margin-left:2px}
.wish-list{max-height:min(60vh,520px);overflow:auto;border-top:1px solid var(--line)}
.wish-list ul{list-style:none;margin:0;padding:0}.wish-list li{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:10px 4px;border-bottom:1px solid var(--line)}
.wish-list li b{display:block}.wish-list li small{display:block;color:var(--mute);font-size:12.5px}
.wish-g{padding:2px 10px;border-radius:999px;background:var(--navy-soft);color:var(--navy);font-size:12px;font-weight:700;white-space:nowrap}
.wish-m{padding:24px 4px;color:var(--mute);text-align:center;margin:0}
@media (max-width:560px){.wish-list li{grid-template-columns:minmax(0,1fr)}}
.lookup{display:grid;gap:10px;padding:16px;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
.lookup h3{font-size:16px}.stwrap .lookup{padding:20px 22px;gap:12px}.stwrap .lookup .f input{height:44px}.stwrap .lookup .btn{min-height:44px}.lookup .d{margin:-6px 0 0;color:var(--mute);font-size:12.5px}
.lookup .f input{height:38px;font-size:14px}
.lk-res{border-radius:10px;background:var(--navy-soft);padding:12px}
.lk-st{font-weight:700;color:var(--navy);white-space:pre-wrap;margin-bottom:8px}
.lk-res dl{display:grid;grid-template-columns:auto minmax(0,1fr);gap:2px 10px;margin:0;font-size:12.5px}.lk-res dt{color:var(--mute)}.lk-res dd{margin:0;overflow-wrap:anywhere}
.refno{margin:14px 0 4px;font-size:16px}.refno b{font-family:var(--f-mono);color:var(--navy);font-size:18px}.refno-d{margin:0;color:var(--mute);font-size:13px}
.main{padding-block:18px 60px}
.formhead{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:14px;margin-bottom:16px}
.formhead h2{font-size:24px}
.steps{display:flex;flex-wrap:wrap;gap:6px;list-style:none;margin:0;padding:0}
.steps li{display:flex;align-items:center;gap:7px;padding:6px 13px 6px 7px;border-radius:999px;background:var(--surface2);color:var(--mute);font-size:13px;font-weight:600}
.steps li i{display:inline-flex;align-items:center;justify-content:center;width:21px;height:21px;border-radius:50%;background:var(--line2);color:#fff;font-style:normal;font-size:11.5px;font-family:var(--f-mono)}
.steps li.on{background:var(--navy);color:#fff}.steps li.on i{background:#fff;color:var(--navy)}
.steps li.done{color:var(--ink)}.steps li.done i{background:var(--ok)}
.steps li.go{cursor:pointer}.steps li.go:hover{background:var(--navy-soft)}.steps li.done.go:hover{background:var(--ok-soft)}
.card{border:1px solid var(--line);border-radius:14px;background:var(--surface);padding:22px 22px 24px}
.card + .card{margin-top:0}
.card > h3{font-size:17px}
.sec-sp{height:14px}
.card > p.d{margin:4px 0 16px;color:var(--mute);font-size:13.5px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 18px}
.grid .full{grid-column:1/-1}
.f{display:flex;flex-direction:column;gap:6px;font-size:13.5px;font-weight:600;color:var(--ink2);min-width:0}
.f .lab{display:flex;align-items:baseline;flex-wrap:wrap;gap:0 8px}
.f .req{color:var(--bad);margin-left:2px}
.f .hint{font-weight:400;color:var(--faint);font-size:11.5px}
.f input,.f select,.f textarea{height:44px;border:1px solid var(--line2);border-radius:9px;padding:0 12px;background:var(--surface);color:var(--ink);font-weight:400;font-size:15px;min-width:0;width:100%}
.f textarea{height:auto;min-height:100px;padding:10px 12px;resize:vertical;line-height:1.55}
.f.err input,.f.err select,.f.err textarea{border-color:var(--bad)}
.msg{color:var(--bad);font-size:12px;font-weight:600}
.item{border:1px solid var(--line);border-radius:12px;padding:16px;background:var(--surface2)}
.item + .item{margin-top:12px}
.item header{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.item header b{font-family:var(--f-disp)}
.link{border:0;background:none;color:var(--bad);cursor:pointer;font-weight:600;font-size:13px;padding:4px}
.up{display:grid;grid-template-columns:180px 1fr auto;align-items:center;gap:12px;padding:12px 14px;border:1px dashed var(--line2);border-radius:10px;background:var(--surface)}
.up + .up{margin-top:10px}
.up.drag{border-color:var(--navy);background:var(--navy-soft)}
.up.err{border-color:var(--bad);background:var(--bad-soft)}
.up b{font-size:14px}.up b small{display:block;font-weight:400;color:var(--mute);font-size:12px}
.up .files{display:flex;flex-wrap:wrap;gap:6px;font-size:13px;color:var(--ink2);min-width:0}
.up .files span{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;background:var(--surface2);max-width:100%;overflow-wrap:anywhere}
.up .files span button{border:0;background:none;cursor:pointer;color:var(--mute);padding:0;font-size:15px;line-height:1}
.up input[type=file]{position:absolute;width:1px;height:1px;opacity:0}
.tag{font-size:11px;font-weight:700;padding:1px 8px;border-radius:999px;margin-left:6px;vertical-align:1px}
.tag.req{background:var(--warn-soft);color:var(--warn)}.tag.opt{background:var(--surface2);color:var(--mute)}
.agree{max-height:150px;overflow:auto;padding:12px 14px;border-radius:10px;background:var(--surface2);font-size:13px;color:var(--ink2);white-space:pre-line;margin:16px 0 12px}
.ck{display:inline-flex;align-items:center;gap:8px;padding:10px 14px;border:1px solid var(--line2);border-radius:10px;font-weight:600;font-size:14px;cursor:pointer;background:var(--surface)}
.ck input{width:17px;height:17px;accent-color:var(--navy);margin:0}
.ck.on{border-color:var(--navy);background:var(--navy-soft)}
.alert.miss{display:grid;gap:8px;margin:14px 0 0}.alert .mrow{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:12px}.alert .mrow .btn{border-color:var(--bad);color:var(--bad);background:var(--surface)}
.alert{padding:12px 16px;border-radius:10px;background:var(--bad-soft);color:var(--bad);font-weight:600;font-size:14px;margin-bottom:14px}
.foot{display:flex;align-items:center;gap:10px;margin-top:20px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 20px;border-radius:10px;border:1px solid var(--line2);background:var(--surface);color:var(--ink);font-weight:700;cursor:pointer;font-size:14.5px}
.btn:hover{border-color:var(--navy)}
.btn.pri{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.sm{min-height:34px;padding:0 13px;font-size:13px}
.btn:disabled{opacity:.55;cursor:default}
.done{text-align:center;padding:56px 22px}
.done .mark{width:64px;height:64px;border-radius:50%;margin:0 auto 16px;background:var(--grad);display:flex;align-items:center;justify-content:center;color:#fff;font-size:30px;font-weight:900}
.done h2{font-size:24px}
@media (max-width:1280px){.formgrid{grid-template-columns:minmax(280px,0.8fr) minmax(0,1.4fr)}.col-c{grid-column:1/-1}}
@media (max-width:900px){.formgrid{grid-template-columns:minmax(0,1fr)}.col-c,.formgrid > .done{grid-column:auto}.col-a .grid{grid-template-columns:1fr 1fr}}
@media (max-width:760px){
  .cards{grid-template-columns:1fr;gap:16px}.card3{min-height:200px}
  .flow{grid-template-columns:1fr 1fr;gap:12px;flex-basis:100%}
  .grid{grid-template-columns:1fr}
  .up{grid-template-columns:1fr}
  .card{padding:18px 16px}
}
@media (prefers-reduced-motion:no-preference){.btn,.ck,.up,button.card3{transition:border-color .15s,background .15s,box-shadow .15s}}
</style>

      <div class="wish-bar"><span class="ipills" role="group">${[['원료', t('wish_raw')], ['부자재', t('wish_sub')]].map(([k, l]) => `<button type="button" class="${W.kind === k ? 'on' : ''}" data-wishk="${k}">${esc(l)} <small>${W.items ? nOf(k) : ''}</small></button>`).join('')}</span>
        <input id="wishQ" type="search" placeholder="${esc(t('wish_q'))}" value="${esc(W.q)}" autocomplete="off"></div>
      <div class="wish-list">${W.busy ? `<p class="wish-m">${esc(t('wish_load'))}</p>` : W.err ? `<p class="wish-m">${esc(W.err)}</p>` : !all.length ? `<p class="wish-m">${esc(t('wish_empty'))}</p>` : !list.length ? `<p class="wish-m">${esc(t('wish_none'))}</p>`
        : `<ul>${list.slice(0, 300).map((x) => `<li><div><b>${esc(x.name)}</b>${x.spec ? `<small>${esc(x.spec)}</small>` : ''}</div>${x.group ? `<span class="wish-g">${esc(x.group)}</span>` : ''}<button type="button" class="btn sm" data-wishpick="${esc(x.name)}" data-wishspec="${esc(x.spec)}">${esc(t('wish_go'))}</button></li>`).join('')}</ul>`}</div></div>`;
    if (pos !== null) { const q2 = box.querySelector('#wishQ'); q2.focus(); try { q2.setSelectionRange(pos, pos); } catch { /* 무시 */ } }
  }
  document.addEventListener('click', (e) => {
    if (e.target.closest('[data-wish]')) { W.open = true; renderWish(); loadWish(); setTimeout(() => document.getElementById('wishQ')?.focus(), 30); return; }
    if (!W.open) return;
    if (e.target.closest('[data-wishx]') || e.target.id === 'wishPop') { W.open = false; renderWish(); return; }
    const k = e.target.closest('[data-wishk]'); if (k) { W.kind = k.dataset.wishk; renderWish(); return; }
    const pk = e.target.closest('[data-wishpick]'); if (pk) {
      const it = S.d.items[S.itemSel ?? 0] || S.d.items[0];
      if (it && !it.name.trim()) { it.name = pk.dataset.wishpick; if (!it.grade.trim() && pk.dataset.wishspec) it.grade = pk.dataset.wishspec; }
      else { S.d.items.push({ ...blankItem(), name: pk.dataset.wishpick, grade: pk.dataset.wishspec || '' }); S.itemSel = S.d.items.length - 1; }
      W.open = false; renderWish(); goView('supply'); return;
    }
  });
  document.addEventListener('input', (e) => { if (e.target.id === 'wishQ') { W.q = e.target.value; renderWish(); } });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && W.open) { W.open = false; renderWish(); } });
  function render(){
    document.documentElement.lang = lang === 'zh' ? 'zh-CN' : lang;
    $('#langBox').innerHTML = [['ko','한국어'],['en','English'],['zh','中文']].map(([k, l]) => `<button type="button" data-lang="${k}" aria-pressed="${lang === k}">${l}</button>`).join('');
    $('#stBtn span').textContent = t('lk_t'); $('#wishBtn span').textContent = t('wish_t');
    renderWish(); $('#stBtn').setAttribute('aria-pressed', String(S.view === 'status'));
    $('#view').innerHTML = S.view === 'supply' ? viewSupply() : (S.view === 'status' ? viewStatus() : viewHome());
  }
  const goView = (v) => { S.view = v; if (v === 'supply' && S.step === 4) { S.step = 1; } try { history.replaceState(null, '', v === 'home' ? location.pathname : `#${v}`); } catch { location.hash = v === 'home' ? '' : v; } render(); window.scrollTo(0, 0); };
  const addFiles = (k, list) => { const arr = S.d.files[k] || (S.d.files[k] = []); [...list].forEach((f) => arr.push({ name:f.name, size:f.size, type:f.type, file:f })); if (S.errs) { delete S.errs[`att_${k}`]; delete S.errs.size; } render(); };
  document.addEventListener('click', (e) => {
    const lb = e.target.closest('[data-lang]'); if (lb) { lang = lb.dataset.lang; try { localStorage.setItem('cbp-lang', lang); } catch { /* 무시 */ } render(); return; }
    if (e.target.closest('[data-home]')) { goView('home'); return; }
    if (e.target.closest('[data-go="supply"]')) { goView('supply'); return; }
    if (e.target.closest('[data-go="status"]')) { goView('status'); return; }
    const jp = e.target.closest('[data-jump]'); if (jp) { const [sec, idx] = jp.dataset.jump.split('|'); if (idx !== undefined) { S.itemSel = +idx; render(); } const sc = $(`#sec-${sec}`); if (sc) { sc.scrollIntoView({ behavior:'smooth', block:'start' }); const f = sc.querySelector('.f.err input, .f.err select, .f.err textarea'); if (f) setTimeout(() => f.focus({ preventScroll:true }), 400); } return; }
    if (e.target.closest('[data-submit]')) { submit(); return; }
    const ip = e.target.closest('[data-ipill]'); if (ip) { S.itemSel = +ip.dataset.ipill; render(); return; }
    if (e.target.closest('[data-delitem]')) { if (S.d.items.length > 1) { S.d.items.splice(S.itemSel, 1); S.itemSel = Math.max(0, S.itemSel - 1); render(); } return; }
    if (e.target.closest('[data-add]')) { S.d.items.push(blankItem()); S.itemSel = S.d.items.length - 1; render(); const f = $('#f_name_' + S.itemSel); if (f) f.focus({ preventScroll:true }); return; }
    const rm = e.target.closest('[data-rm]'); if (rm) { S.d.items.splice(+rm.dataset.rm, 1); render(); return; }
    const rf = e.target.closest('[data-rmf]'); if (rf) { const [k, j] = rf.dataset.rmf.split('|'); S.d.files[k].splice(+j, 1); render(); }
  });
  document.addEventListener('submit', (e) => { if (e.target.id === 'lkForm') { e.preventDefault(); lookup(); } });
  document.addEventListener('input', (e) => { const el = e.target; if (el.dataset && el.dataset.lk) { S.lk[el.dataset.lk] = el.value; return; } if (!el.dataset || !el.dataset.k) return; if (el.dataset.i !== undefined) S.d.items[+el.dataset.i][el.dataset.k] = el.value; else S.d[el.dataset.k] = el.value; });
  document.addEventListener('change', (e) => {
    const el = e.target;
    if (el.dataset.k && el.tagName === 'SELECT') { if (el.dataset.i !== undefined) S.d.items[+el.dataset.i][el.dataset.k] = el.value; else S.d[el.dataset.k] = el.value; return; }
    if (el.dataset.file) { addFiles(el.dataset.file, el.files); return; }
    if (el.hasAttribute('data-agree')) { S.d.agree = el.checked; if (S.errs) delete S.errs.agree; render(); }
  });
  document.addEventListener('dragover', (e) => { const z = e.target.closest('[data-drop]'); if (!z) return; e.preventDefault(); z.classList.add('drag'); });
  document.addEventListener('dragleave', (e) => { const z = e.target.closest('[data-drop]'); if (z) z.classList.remove('drag'); });
  document.addEventListener('drop', (e) => { const z = e.target.closest('[data-drop]'); if (!z) return; e.preventDefault(); addFiles(z.dataset.drop, e.dataTransfer.files); });
  window.addEventListener('hashchange', () => { const v = viewOfHash(); if (v !== S.view) { S.view = v; render(); } });
  render();
})();
</script>
</body>
</html>
