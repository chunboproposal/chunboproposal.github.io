<style>
/* Layout: 로고 머리줄 → 문의 종류 3가지(카드) → 공급 제안: 안내(절차 · 제출 자료) + 4단계 양식 → 제출 완료 */
:root{
  color-scheme:light;
  --bg:#f6f7fa; --surface:#ffffff; --surface2:#eef1f7; --line:#dde2ec; --line2:#c9d0dd;
  --ink:#0d1b3d; --ink2:#3a4762; --mute:#6d7891; --faint:#98a1b5;
  --navy:#14266e; --blue:#1b8fd6; --navy-soft:#e9ecf8;
  --ok:#1d8a5a; --ok-soft:#e5f5ed; --bad:#c2303b; --bad-soft:#fbeaec; --warn:#b26b00; --warn-soft:#fff3df;
  --grad:linear-gradient(135deg,#a3238e 0%,#6a2c91 45%,#13a3b5 100%);
  --f-disp:"IBM Plex Sans KR","Noto Sans KR","Noto Sans SC","Malgun Gothic","Microsoft YaHei",sans-serif;
  --f-body:"Noto Sans KR","Noto Sans SC","Malgun Gothic","Apple SD Gothic Neo","Microsoft YaHei",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6}
body{word-break:keep-all;overflow-wrap:anywhere;min-height:100vh;display:flex;flex-direction:column}#view{flex:1 0 auto}
#view:has(.home){background:var(--surface)}
img{max-width:100%}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:1040px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--f-disp);text-wrap:balance;color:var(--ink);margin:0}
.top{background:var(--surface);border-bottom:1px solid var(--line)}
.top .bar{display:flex;align-items:center;gap:28px;padding-block:0;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));min-height:68px;flex-wrap:nowrap}
.logo{display:inline-flex;align-items:center;border:0;background:none;padding:0;cursor:pointer}
.logo-svg{height:46px;width:auto;display:block}
@media (max-width:480px){.logo-svg{height:36px}.top .bar{gap:10px}.lang button{padding:5px 8px;font-size:12px}}
.spacer{flex:1}
.lang{display:inline-flex;gap:2px;padding:3px;border:1px solid var(--line);border-radius:999px;background:var(--surface2)}
.lang button{border:0;background:transparent;padding:5px 12px;border-radius:999px;font-size:13px;font-weight:600;color:var(--ink2);cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--navy);color:#fff}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
/* 문의 종류 */
.home{padding-block:10px 70px;background:var(--surface)}
.sec-title{margin:40px 0 0;padding-bottom:18px;border-bottom:1px solid var(--ink);font-size:27px;font-weight:800}
.sec-desc{margin:22px 0 24px;color:var(--ink2);font-size:16px}
.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:28px}
.card3{position:relative;min-height:250px;border:1px solid var(--line2);border-radius:22px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center;padding:26px;background:var(--surface);color:var(--ink)}
button.card3{cursor:pointer;font:inherit}
button.card3:hover{box-shadow:0 10px 30px rgba(13,27,61,.08);border-color:#b5bccb}
.card3 h3{margin:6px 0 0;font-size:22px;font-weight:800;letter-spacing:.04em}
.card3 p{margin:0;font-size:14px;color:var(--mute)}
.card3 .go{position:absolute;right:30px;bottom:24px;font-size:13px;color:var(--ink2);display:flex;align-items:center;gap:8px}
.card3 .go i{display:inline-block;width:22px;height:1px;background:#888;position:relative}
.card3 .go i::after{content:"";position:absolute;right:0;top:-3px;width:7px;height:1px;background:#888;transform:rotate(30deg);transform-origin:right}
.card3 .soon{position:absolute;top:18px;right:20px;padding:2px 10px;border-radius:999px;background:var(--surface2);color:var(--mute);font-size:12px;font-weight:700}
.card3.dim{opacity:.75}
.ico{width:64px;height:64px}
/* 공급 제안 */
.intro{padding-block:32px 8px}
.crumb{font-size:13px;color:var(--mute)}
.crumb button{border:0;background:none;padding:0;color:var(--blue);cursor:pointer;font-weight:600}
.intro h1{font-size:clamp(26px,4vw,34px);font-weight:700;margin:8px 0 10px}
.intro p{max-width:66ch;color:var(--ink2);margin:0}
.layout{display:grid;grid-template-columns:240px minmax(0,1fr);gap:28px;align-items:start}
.flow{list-style:none;margin:0;padding:18px 18px 6px;border:1px solid var(--line);border-radius:14px;background:var(--surface);position:sticky;top:calc(env(safe-area-inset-top,0px) + 16px)}
.flow li{position:relative;padding:0 0 22px 40px;min-width:0}
.flow li::before{content:"";position:absolute;left:13px;top:28px;bottom:2px;width:2px;background:var(--line)}
.flow li:last-child::before{display:none}
.flow li .dot{position:absolute;left:0;top:0;width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--surface2);color:var(--mute);font-family:var(--f-mono);font-size:12px;font-weight:600}
.flow li.on .dot{background:var(--navy);color:#fff}
.flow li.past .dot{background:var(--ok);color:#fff}
.flow li.past::before{background:var(--ok)}
.flow .n{display:block;font-family:var(--f-mono);font-size:11.5px;color:var(--blue);letter-spacing:.06em}
.flow b{display:block;font-family:var(--f-disp);font-size:15px;margin:2px 0 2px}
.flow small{display:block;color:var(--mute);font-size:13px;line-height:1.5}
.flow li.on b{color:var(--navy)}
.main{padding-block:24px 60px}
.formhead{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:14px;margin-bottom:16px}
.formhead h2{font-size:24px}
.steps{display:flex;flex-wrap:wrap;gap:6px;list-style:none;margin:0;padding:0}
.steps li{display:flex;align-items:center;gap:7px;padding:6px 13px 6px 7px;border-radius:999px;background:var(--surface2);color:var(--mute);font-size:13px;font-weight:600}
.steps li i{display:inline-flex;align-items:center;justify-content:center;width:21px;height:21px;border-radius:50%;background:var(--line2);color:#fff;font-style:normal;font-size:11.5px;font-family:var(--f-mono)}
.steps li.on{background:var(--navy);color:#fff}.steps li.on i{background:#fff;color:var(--navy)}
.steps li.done{color:var(--ink)}.steps li.done i{background:var(--ok)}
.steps li.done.go{cursor:pointer}.steps li.done.go:hover{background:var(--navy-soft)}
.card{border:1px solid var(--line);border-radius:14px;background:var(--surface);padding:22px 22px 24px}
.card + .card{margin-top:14px}
.card > h3{font-size:17px}
.card > p.d{margin:4px 0 16px;color:var(--mute);font-size:13.5px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 18px}
.grid .full{grid-column:1/-1}
.f{display:flex;flex-direction:column;gap:6px;font-size:13.5px;font-weight:600;color:var(--ink2);min-width:0}
.f .lab{display:flex;align-items:baseline;flex-wrap:wrap;gap:0 8px}
.f .req{color:var(--bad);margin-left:2px}
.f .hint{font-weight:400;color:var(--faint);font-size:11.5px}
.f input,.f select,.f textarea{height:44px;border:1px solid var(--line2);border-radius:9px;padding:0 12px;background:var(--surface);color:var(--ink);font-weight:400;font-size:15px;min-width:0;width:100%}
.f textarea{height:auto;min-height:100px;padding:10px 12px;resize:vertical;line-height:1.55}
.f.err input,.f.err select,.f.err textarea{border-color:var(--bad)}
.msg{color:var(--bad);font-size:12px;font-weight:600}
.item{border:1px solid var(--line);border-radius:12px;padding:16px;background:var(--surface2)}
.item + .item{margin-top:12px}
.item header{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.item header b{font-family:var(--f-disp)}
.link{border:0;background:none;color:var(--bad);cursor:pointer;font-weight:600;font-size:13px;padding:4px}
.up{display:grid;grid-template-columns:180px 1fr auto;align-items:center;gap:12px;padding:12px 14px;border:1px dashed var(--line2);border-radius:10px;background:var(--surface)}
.up + .up{margin-top:10px}
.up.drag{border-color:var(--navy);background:var(--navy-soft)}
.up.err{border-color:var(--bad);background:var(--bad-soft)}
.up b{font-size:14px}.up b small{display:block;font-weight:400;color:var(--mute);font-size:12px}
.up .files{display:flex;flex-wrap:wrap;gap:6px;font-size:13px;color:var(--ink2);min-width:0}
.up .files span{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;background:var(--surface2);max-width:100%;overflow-wrap:anywhere}
.up .files span button{border:0;background:none;cursor:pointer;color:var(--mute);padding:0;font-size:15px;line-height:1}
.up input[type=file]{position:absolute;width:1px;height:1px;opacity:0}
.tag{font-size:11px;font-weight:700;padding:1px 8px;border-radius:999px;margin-left:6px;vertical-align:1px}
.tag.req{background:var(--warn-soft);color:var(--warn)}.tag.opt{background:var(--surface2);color:var(--mute)}
.agree{max-height:150px;overflow:auto;padding:12px 14px;border-radius:10px;background:var(--surface2);font-size:13px;color:var(--ink2);white-space:pre-line;margin:16px 0 12px}
.ck{display:inline-flex;align-items:center;gap:8px;padding:10px 14px;border:1px solid var(--line2);border-radius:10px;font-weight:600;font-size:14px;cursor:pointer;background:var(--surface)}
.ck input{width:17px;height:17px;accent-color:var(--navy);margin:0}
.ck.on{border-color:var(--navy);background:var(--navy-soft)}
.alert{padding:12px 16px;border-radius:10px;background:var(--bad-soft);color:var(--bad);font-weight:600;font-size:14px;margin-bottom:14px}
.foot{display:flex;align-items:center;gap:10px;margin-top:20px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 20px;border-radius:10px;border:1px solid var(--line2);background:var(--surface);color:var(--ink);font-weight:700;cursor:pointer;font-size:14.5px}
.btn:hover{border-color:var(--navy)}
.btn.pri{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.sm{min-height:34px;padding:0 13px;font-size:13px}
.btn:disabled{opacity:.55;cursor:default}
.done{text-align:center;padding:56px 22px}
.done .mark{width:64px;height:64px;border-radius:50%;margin:0 auto 16px;background:var(--grad);display:flex;align-items:center;justify-content:center;color:#fff;font-size:30px;font-weight:900}
.done h2{font-size:24px}
@media (max-width:760px){
  .cards{grid-template-columns:1fr;gap:16px}.card3{min-height:200px}
  .layout{grid-template-columns:1fr;gap:16px}.flow{position:static;display:grid;grid-template-columns:1fr 1fr;gap:4px 12px;padding:14px 14px 0}.flow li::before{display:none}.flow li{padding-bottom:14px}
  .grid{grid-template-columns:1fr}
  .up{grid-template-columns:1fr}
  .card{padding:18px 16px}
}
@media (prefers-reduced-motion:no-preference){.btn,.ck,.up,button.card3{transition:border-color .15s,background .15s,box-shadow .15s}}
</style>
</head>

    </section>
    <main class="wrap main"><div class="layout">
      <ol class="flow" aria-label="${esc(t('crumb'))}">${t('flow').map(([h, p], i) => `<li class="${i + 1 === cur ? 'on' : (i + 1 < cur ? 'past' : '')}"><span class="dot">${i + 1 < cur ? '✓' : i + 1}</span><span class="n">STEP ${i + 1}</span><b>${esc(h)}</b><small>${esc(p)}</small></li>`).join('')}</ol>
      <div id="form">${viewForm()}</div>
    </div></main>`;
  }
  function validate(step){
    const d = S.d, e = {}; const req = (k, v) => { if (!String(v ?? '').trim()) e[k] = t('required'); };
    if (step === 1) { ['contact','title','email','phone','company','country'].forEach((k) => req(k, d[k])); if (d.email && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(d.email.trim())) e.email = t('email_bad'); }
    if (step === 2) d.items.forEach((it, i) => ['name','grade','maker','origin','capacity','strength'].forEach((k) => req(`${k}${i}`, it[k])));
    if (step === 3) {
      ATT.forEach((k) => { if (ATT_REQ[k] && !(d.files[k] || []).length) e[`att_${k}`] = t('att_req').replace('{n}', t('att')[k][0]); });
      if (totalSize() > MAX_TOTAL) e.size = t('too_big');
      if (!d.agree) e.agree = t('agree_req');
    }
    S.errs = e; return !Object.keys(e).length;
  }
  const toB64 = (file) => new Promise((ok, no) => { const r = new FileReader(); r.onload = () => ok(String(r.result).split(',')[1] || ''); r.onerror = () => no(r.error); r.readAsDataURL(file); });
  async function submit(){
    if (S.busy) return;
    if (!validate(3)) { render(); return; }
    if (!/^https:\/\/script\.google(usercontent)?\.com\//.test(ENDPOINT)) { S.failMsg = t('not_ready'); render(); return; }
    S.busy = true; S.failMsg = ''; render();
    try {
      const d = S.d; const files = [];
      for (const k of ATT) for (const f of (d.files[k] || [])) files.push({ kind:k, name:f.name, type:f.type || 'application/octet-stream', size:f.size, data: await toB64(f.file) });
      const payload = { action:'submit', lang, contact:d.contact.trim(), title:d.title.trim(), email:d.email.trim(), phone:d.phone.trim(), company:d.company.trim(), country:d.country,
        items:d.items.map((x) => ({ ...x, name:x.name.trim() })), agree:true, files, hp:'' };
      const r = await fetch(ENDPOINT, { method:'POST', body: JSON.stringify(payload) });
      const j = await r.json();
      if (!j || !j.ok) throw new Error((j && j.error) || 'fail');
      S.step = 4; S.d = fresh();
    } catch (err) { S.failMsg = t('fail'); }
    S.busy = false; render(); $('#form') && $('#form').scrollIntoView({ block:'start' });
  }

  /* ── 그리기 · 이벤트 ── */
  function render(){
    document.documentElement.lang = lang === 'zh' ? 'zh-CN' : lang;
    $('#langBox').innerHTML = [['ko','한국어'],['en','English'],['zh','中文']].map(([k, l]) => `<button type="button" data-lang="${k}" aria-pressed="${lang === k}">${l}</button>`).join('');
    $('#view').innerHTML = S.view === 'supply' ? viewSupply() : viewHome();
  }
  const goView = (v) => { S.view = v; if (v === 'supply' && S.step === 4) { S.step = 1; } try { history.replaceState(null, '', v === 'supply' ? '#supply' : location.pathname); } catch { location.hash = v === 'supply' ? 'supply' : ''; } render(); window.scrollTo(0, 0); };
  const addFiles = (k, list) => { const arr = S.d.files[k] || (S.d.files[k] = []); [...list].forEach((f) => arr.push({ name:f.name, size:f.size, type:f.type, file:f })); if (S.errs) { delete S.errs[`att_${k}`]; delete S.errs.size; } render(); };
  document.addEventListener('click', (e) => {
    const lb = e.target.closest('[data-lang]'); if (lb) { lang = lb.dataset.lang; try { localStorage.setItem('cbp-lang', lang); } catch { /* 무시 */ } render(); return; }
    if (e.target.closest('[data-home]')) { goView('home'); return; }
    if (e.target.closest('[data-go="supply"]')) { goView('supply'); return; }
    if (e.target.closest('[data-next]')) { if (validate(S.step)) { S.step += 1; S.errs = null; } render(); $('#form').scrollIntoView({ block:'start' }); return; }
    const gt = e.target.closest('[data-goto]'); if (gt) { S.step = +gt.dataset.goto; S.errs = null; S.failMsg = ''; render(); $('#form').scrollIntoView({ block:'start' }); return; }
    if (e.target.closest('[data-prev]')) { S.step -= 1; S.errs = null; S.failMsg = ''; render(); $('#form').scrollIntoView({ block:'start' }); return; }
    if (e.target.closest('[data-submit]')) { submit(); return; }
    if (e.target.closest('[data-add]')) { S.d.items.push(blankItem()); render(); return; }
    const rm = e.target.closest('[data-rm]'); if (rm) { S.d.items.splice(+rm.dataset.rm, 1); render(); return; }
    const rf = e.target.closest('[data-rmf]'); if (rf) { const [k, j] = rf.dataset.rmf.split('|'); S.d.files[k].splice(+j, 1); render(); }
  });
  document.addEventListener('keydown', (e) => { const g = e.target.closest && e.target.closest('[data-goto]'); if (g && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); g.click(); } });
  document.addEventListener('input', (e) => { const el = e.target; if (!el.dataset || !el.dataset.k) return; if (el.dataset.i !== undefined) S.d.items[+el.dataset.i][el.dataset.k] = el.value; else S.d[el.dataset.k] = el.value; });
  document.addEventListener('change', (e) => {
    const el = e.target;
    if (el.dataset.k && el.tagName === 'SELECT') { if (el.dataset.i !== undefined) S.d.items[+el.dataset.i][el.dataset.k] = el.value; else S.d[el.dataset.k] = el.value; return; }
    if (el.dataset.file) { addFiles(el.dataset.file, el.files); return; }
    if (el.hasAttribute('data-agree')) { S.d.agree = el.checked; if (S.errs) delete S.errs.agree; render(); }
  });
  document.addEventListener('dragover', (e) => { const z = e.target.closest('[data-drop]'); if (!z) return; e.preventDefault(); z.classList.add('drag'); });
  document.addEventListener('dragleave', (e) => { const z = e.target.closest('[data-drop]'); if (z) z.classList.remove('drag'); });
  document.addEventListener('drop', (e) => { const z = e.target.closest('[data-drop]'); if (!z) return; e.preventDefault(); addFiles(z.dataset.drop, e.dataTransfer.files); });
  window.addEventListener('hashchange', () => { const v = location.hash === '#supply' ? 'supply' : 'home'; if (v !== S.view) { S.view = v; render(); } });
  render();
})();
</script>
</body>
</html>
